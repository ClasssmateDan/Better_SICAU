<h1>课程主页 HAR 桥接</h1>
<p>1. 在这个浏览器里正常登录学校网站，并保持学校标签页打开。</p>
<p>2. 在桌面工具点击“读取本机浏览器登录”。</p>
<p>3. 自动读取一次学生主页，保存并导入 HAR。</p>
<p>若系统默认浏览器不同，请在桌面工具点击“复制连接链接”，粘贴到这个浏览器地址栏打开。</p>
<p>只处理桌面工具发起的本次请求，结果仅交给本机 127.0.0.1:18763。签到请求需在桌面工具中手动发送。</p>
